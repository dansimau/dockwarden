# Example deployment of dockwarden as a compose service.
#
# Key points:
#   * The Docker socket is mounted so dockwarden can inspect, pull, build and
#     recreate containers.
#   * Compose project directories are mounted at the SAME path as on the
#     host (e.g. /volume1/docker on a Synology NAS). The compose labels on
#     containers record absolute host paths, and `docker compose build`
#     needs the build context at that path. If you can't mount at the same
#     path, set compose.path_map in the config instead.
#   * ~/.docker/config.json is mounted read-only for private registries.
#   * Secrets come from environment variables or files, not the YAML config.
services:
  dockwarden:
    image: ghcr.io/dansimau/dockwarden:latest
    container_name: dockwarden
    restart: unless-stopped
    command: ["--config", "/etc/dockwarden/config.yaml", "--interval", "24h"]
    environment:
      - TZ=Europe/Amsterdam
      # Uncomment for the synology strategy; or use *_FILE with docker secrets.
      # - DOCKWARDEN_SYNOLOGY_USERNAME=dockwarden
      # - DOCKWARDEN_SYNOLOGY_PASSWORD_FILE=/run/secrets/dsm_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.yaml:/etc/dockwarden/config.yaml:ro
      - dockwarden-state:/var/lib/dockwarden
      - ~/.docker/config.json:/root/.docker/config.json:ro
      # Compose projects with `build:` sections, mounted at identical paths:
      - /volume1/docker:/volume1/docker
    labels:
      # dockwarden never updates itself; this label makes that explicit.
      com.dockwarden.enable: "false"
    # secrets:
    #   - dsm_password

volumes:
  dockwarden-state:

